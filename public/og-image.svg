<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#050507"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Centered Card -->
  <g transform="translate(600, 315)">
    <!-- Logo Badge -->
    <rect x="-48" y="-190" width="96" height="96" rx="24" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <rect x="-30" y="-172" width="60" height="60" rx="12" fill="none" stroke="#f4f4f5" stroke-width="4"/>
    <line x1="-10" y1="-172" x2="-10" y2="-112" stroke="#f4f4f5" stroke-width="4"/>
    <line x1="4" y1="-155" x2="20" y2="-155" stroke="#f4f4f5" stroke-width="4" stroke-linecap="round"/>
    <line x1="4" y1="-138" x2="20" y2="-138" stroke="#f4f4f5" stroke-width="4" stroke-linecap="round"/>

    <!-- Title -->
    <text text-anchor="middle" y="-30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Creafolio
    </text>

    <!-- Subtitle / Tagline -->
    <text text-anchor="middle" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#fbbf24" letter-spacing="-0.5">
      The Vibe Coder's Vault
    </text>

    <text text-anchor="middle" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa">
      Curated AI Tools • Creative Engineering • UI Libraries • Web Inspirations
    </text>

    <!-- Pill tags -->
    <g transform="translate(0, 140)">
      <rect x="-240" y="0" width="140" height="34" rx="17" fill="#18181b" stroke="#27272a"/>
      <text x="-170" y="22" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#e4e4e7">AI TOOLS</text>

      <rect x="-80" y="0" width="160" height="34" rx="17" fill="#18181b" stroke="#27272a"/>
      <text x="0" y="22" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#e4e4e7">3D &amp; WEBGL</text>

      <rect x="100" y="0" width="140" height="34" rx="17" fill="#18181b" stroke="#27272a"/>
      <text x="170" y="22" text-anchor="middle" font-family="monospace" font-size="13" font-weight="600" fill="#e4e4e7">UI &amp; MOTION</text>
    </g>
  </g>
</svg>
