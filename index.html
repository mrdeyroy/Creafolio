<body class="bg-black text-white selection:bg-white/20 selection:text-white">
  <div id="root">
    <div id="initial-vault-loader" style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;user-select:none;">
      <div style="position:relative;width:50px;height:50px;display:flex;align-items:center;justify-content:center;">
        <svg style="position:absolute;inset:0;width:50px;height:50px;animation:vaultSpin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;" viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="25" r="21" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />
          <path d="M25 4 A21 21 0 0 1 46 25" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
        </svg>
        <div style="width:32px;height:32px;background:#09090b;border:1px solid rgba(255,255,255,0.12);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(16,185,129,0.15);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="4" />
            <path d="M9 3v18" />
            <path d="M14 9h5" />
            <path d="M14 15h5" />
          </svg>
        </div>
      </div>
      <div style="margin-top:14px;font-family:'Geist Mono',monospace,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#71717a;display:flex;align-items:center;gap:6px;">
        <span>Loading vault</span>
        <span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:#10b981;animation:vaultPulse 1.2s ease-in-out infinite;"></span>
      </div>
    </div>
  </div>
  <style>
    @keyframes vaultSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes vaultPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
